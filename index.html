
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gibran Teixeira — Motion Designer</title>
<meta name="description" content="Gibran Teixeira · Senior motion designer specialized in advertising and AI-driven video production · São Paulo, Brazil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2A3BFF;      /* Luminous Blue */
    --a:#F4F0E6;       /* light block */
    --b:#07081C;       /* dark block */
    --ui:#F4F0E6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ui);
    font-family:'Archivo Black','Arial Black',Impact,sans-serif;
    display:grid;grid-template-rows:1fr auto;min-height:100dvh;
    overflow-x:hidden;
  }
  .stage{display:grid;place-items:center;padding:8vh 12vw}

  .word{display:flex;perspective:none;cursor:pointer}

  .cube{
    width:var(--s);height:var(--s);position:relative;flex:none;
    transform-style:preserve-3d;
    transition:transform 1s cubic-bezier(.8,0,.2,1);
    transition-delay:calc(var(--i) * 110ms);
  }
  .cube.down{transform:rotateX(calc(var(--turn,0) * -90deg));}
  .cube.up  {transform:rotateX(calc(var(--turn,0) *  90deg));}

  .cube.light{--blk:var(--a); --ltr:var(--b); --blk2:var(--b); --ltr2:var(--a);}
  .cube.dark {--blk:var(--b); --ltr:var(--a); --blk2:var(--a); --ltr2:var(--b);}

  .face{
    position:absolute;inset:0;display:grid;place-items:center;
    font-size:calc(var(--s) * .66);line-height:1;letter-spacing:-.02em;
    background:var(--blk);color:var(--ltr);
    backface-visibility:hidden;
  }
  .face span{transform:translateY(4%)}
  .face .i{width:calc(var(--s) * .19);height:100%;background:var(--ltr)}
  .top,.bottom{background:var(--blk2);color:var(--ltr2)}
  .top .i,.bottom .i{background:var(--ltr2)}

  .front {transform:translateZ(calc(var(--s)/2)) scale(1.012);}
  .top   {transform:rotateX(90deg)  translateZ(calc(var(--s)/2)) scale(1.012);}
  .back  {transform:rotateX(180deg) translateZ(calc(var(--s)/2)) scale(1.012);}
  .bottom{transform:rotateX(-90deg) translateZ(calc(var(--s)/2)) scale(1.012);}

  footer{
    display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding:0 12vw 5vh;font-size:12px;letter-spacing:.02em;opacity:.85;
  }
  footer a{color:inherit;text-decoration:none;border-bottom:2px solid currentColor}
  footer a:focus-visible{outline:2px solid currentColor;outline-offset:3px}

  @media (prefers-reduced-motion: reduce){.cube{transition:none}}
</style>
</head>
<body>
  <main class="stage">
    <div class="word" id="word" role="img" aria-label="Gibran, also known as Sirena"></div>
  </main>

  <footer>
    <span>Motion designer · São Paulo · available for remote work</span>
    <a href="mailto:gibran.teixeira@we.com.br">say hello</a>
  </footer>

<script>
  const spec = [
    ['G','S','down','light',0],
    ['I','I','up',  'dark', 1],
    ['B','R','down','light',2],
    ['R','E','up',  'dark', 3],
    ['A','N','down','light',4],
    ['N','A','down','light',4],
  ];
  const word = document.getElementById('word');
  const glyph = ch => ch === 'I' ? '<div class="i"></div>' : `<span>${ch}</span>`;
  spec.forEach(([a,b,dir,col,i]) => {
    const c = document.createElement('div');
    c.className = `cube ${dir} ${col}`;
    c.style.setProperty('--i', i);
    c.innerHTML = `
      <div class="face front">${glyph(a)}</div>
      <div class="face top">${glyph(b)}</div>
      <div class="face back">${glyph(a)}</div>
      <div class="face bottom">${glyph(b)}</div>`;
    word.appendChild(c);
  });
  const cubes = [...word.children];

  function size(){
    const s = Math.floor(Math.min(160, Math.max(40, window.innerWidth * 0.76 / 6)));
    word.style.setProperty('--s', s + 'px');
  }
  size(); addEventListener('resize', size);

  let turn = 0;
  const roll = () => { turn++; cubes.forEach(c => c.style.setProperty('--turn', turn)); };
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(roll, 3000);
  word.addEventListener('click', roll);
</script>
</body>
</html>
