
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gibran Teixeira — Motion Designer</title>
<meta name="description" content="Gibran Teixeira · Senior motion designer specialized in advertising and AI-driven video production · São Paulo, Brazil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#2A3BFF; --ui:#F4F0E6; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ui);
    font-family:'Archivo Black','Arial Black',Impact,sans-serif;
    display:grid;grid-template-rows:1fr auto;min-height:100vh;min-height:100dvh;overflow-x:hidden;
  }
  .stage{display:grid;place-items:center;padding:8vh 12vw}
  #gl{width:100%;aspect-ratio:6/1.3;display:block;cursor:pointer;touch-action:manipulation}
  footer{
    display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding:0 12vw 5vh;font-size:12px;letter-spacing:.02em;opacity:.85;
  }
  footer a{color:inherit;text-decoration:none;border-bottom:2px solid currentColor}
  footer a:focus-visible{outline:2px solid currentColor;outline-offset:3px}
  /* fallback while WebGL/fonts load */
  .fallback{font-size:clamp(28px,8vw,120px);letter-spacing:.02em}
</style>
</head>
<body>
  <main class="stage">
    <canvas id="gl" role="img" aria-label="Gibran, also known as Sirena"></canvas>
  </main>
  <footer>
    <span>Motion designer · São Paulo · available for remote work</span>
    <a href="mailto:gibran.teixeira@we.com.br">say hello</a>
  </footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var LIGHT = '#F4F0E6', DARK = '#07081C';
  // [A, B, direction(+1 down / -1 up), first-face light?, delay index]
  var spec = [
    ['G','S', 1, true,  0],
    ['I','I',-1, false, 1],
    ['B','R', 1, true,  2],
    ['R','E',-1, false, 3],
    ['A','N', 1, true,  4],
    ['N','A', 1, true,  4]
  ];
  var canvas = document.getElementById('gl');
  if(!window.THREE){ canvas.outerHTML = '<div class="fallback">GIBRAN</div>'; return; }

  var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;

  var scene = new THREE.Scene();
  var camera = new THREE.OrthographicCamera(-3,3,1,-1,0.1,100);
  camera.position.set(0,0,10); camera.lookAt(0,0,0);

  // letter texture: block colour + letter; I is a full-height bar
  function faceTexture(ch, block, letter){
    var S = 512, c = document.createElement('canvas'); c.width = c.height = S;
    var g = c.getContext('2d');
    g.fillStyle = block; g.fillRect(0,0,S,S);
    g.fillStyle = letter;
    if(ch === 'I'){ g.fillRect(S*0.405, 0, S*0.19, S); }
    else{
      g.font = "900 " + (S*0.66) + "px 'Archivo Black','Arial Black',Impact,sans-serif";
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(ch, S/2, S*0.54);
    }
    var t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  function mat(tex){ return new THREE.MeshBasicMaterial({map:tex}); }
  function solid(col){ return new THREE.MeshBasicMaterial({color:col}); }

  var cubes = [];
  function build(){
    var geo = new THREE.BoxGeometry(1.004,1.004,1.004);   // tiny overlap closes seams
    spec.forEach(function(sp, i){
      var a = sp[0], b = sp[1], light = sp[3];
      var blk1 = light ? LIGHT : DARK, ltr1 = light ? DARK : LIGHT;
      var blk2 = light ? DARK : LIGHT, ltr2 = light ? LIGHT : DARK;
      var fA = faceTexture(a, blk1, ltr1), fB = faceTexture(b, blk2, ltr2);
      // back face UVs are inverted relative to the front: rotate that copy 180°
      var fAback = fA.clone(); fAback.needsUpdate = true;
      fAback.center.set(0.5, 0.5); fAback.rotation = Math.PI;
      // order: +x, -x, +y(top), -y(bottom), +z(front), -z(back)
      var mats = [solid(blk1), solid(blk1), mat(fB), mat(fB), mat(fA), mat(fAback)];
      var m = new THREE.Mesh(geo, mats);
      m.position.x = i - 2.5;
      scene.add(m);
      cubes.push({mesh:m, dir:sp[2], delay:sp[4]*110, from:0, to:0, start:-1});
    });
  }

  function resize(){
    var w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    var view = 6 / 0.98;                      // 6 cubes + 1% breathing
    camera.left = -view/2; camera.right = view/2;
    camera.top = (view/2) * (h/w); camera.bottom = -camera.top;
    camera.updateProjectionMatrix();
  }

  // ease like cubic-bezier(.8,0,.2,1)
  function ease(t){ return t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
  var DUR = 1000;
  function roll(){
    var now = performance.now();
    cubes.forEach(function(c){
      c.from = c.to; c.to = c.from + c.dir * Math.PI/2; c.start = now + c.delay;
    });
  }
  function tick(now){
    cubes.forEach(function(c){
      if(c.start < 0) return;
      var t = (now - c.start) / DUR;
      if(t < 0){ c.mesh.rotation.x = c.from; }
      else if(t >= 1){ c.mesh.rotation.x = c.to; c.start = -1; }
      else c.mesh.rotation.x = c.from + (c.to - c.from) * ease(t);
    });
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  function start(){
    build(); resize(); requestAnimationFrame(tick);
    setInterval(roll, 3000);
    canvas.addEventListener('click', roll);
    window.addEventListener('resize', resize);
  }
  var ready = (document.fonts && document.fonts.load) ? document.fonts.load("900 100px 'Archivo Black'") : Promise.resolve();
  var done = false; function once(){ if(!done){ done = true; start(); } }
  ready.then(once, once); setTimeout(once, 1500);
})();
</script>
</body>
</html>
